# Non-secret settings. Environment variables listed in README take precedence.
# Store credentials in .env or environment variables, not in this file.

[integrations]
# Set false for providers not used in this house; restart after changes.
sensibo = false
tado = true
kmp = true
tibber = true
weather = true

[weather]
latitude = 60.12345
longitude = 15.27237
timezone = Europe/Stockholm
forecast_hours = 36

[operation]
# true: read-only test mode; false: device commands are enabled.
test_mode = true
fan_assist_enabled = false
sensibo_max_fan_level = strong
grid_poll_interval_seconds = 300
fan_poll_interval_seconds = 60
log_file = heating_data_log.csv

[thermal_learning]
# Read-only monitoring; never sends heating commands.
enabled = true
database_path = thermal_history.sqlite3
model_path = thermal_model.joblib

[mpc]
# Shadow planning only; no commands are issued.
enabled = true
# Select sensibo or a mapped Tado room for indoor temperature.
indoor_source = sensibo
tado_room_id =
# Only set true if the corresponding physical source is not present or operating.
heatpump_absent = false
pelletstove_absent = false
# Tado as a sensor is supported only when no other heat sources operate.
other_heating_absent = false
minimum_c = 18
target_c = 20
maximum_c = 22
uncertainty_margin_c = 0.25
max_rate_rmse = 1.0
deviation_penalty = 0.05
switch_penalty = 0.10
electricity_extra_per_kwh = 0
minimum_runtime_minutes = 30
minimum_off_minutes = 30

[heating]
# SEK/kWh: 0 disables the direct spot-price override.
spotPriceLimit = 0
max_price_threshold = 3.0
pellet_price_adjustment = 0.94875
heat_pump_scop = 3.8
min_heat_pump_capacity = 3.0
pellet_stove_capacity = 5.0
heat_pump_capacity_below_minimum = 2.6
# Descending minimum temperatures in Celsius and capacities in kW.
heat_pump_capacity_by_temperature =
    0, 6.5
    -12.5, 4.0
    -17.5, 3.6

[cost_control]
# Set enabled=true only after entering values measured for your installation.
enabled = true
# Pellet bag mass (kg), energy content (kWh/kg), price per bag (SEK), efficiency (%).
pellet_bag_size_kg = 16
pellet_energy_kwh_per_kg = 5
pellet_price_per_bag = 70
stove_efficiency_percent = 94
# Rows: outdoor temperature in C, COP or heating demand in kW, highest temperature first.
cop_by_temperature =
    0, 6.5
    -12.5, 4.0
    -17.5, 3.6
# Illustrative only: 100 m2, 5 kW at -20 C, zero demand at 18 C.
# Adjust to the building before enabling cost control.
demand_by_temperature =
    18, 0
    10, 1.1
    0, 2.4
    -10, 3.7
    -20, 5.0
# Fractional savings required before changing for economic reasons.
cost_hysteresis = 0.10
minimum_runtime_minutes = 30
minimum_switch_interval_minutes = 15

[connections]
solis_base_url = https://api.soliscloud.com:13333
chrome_binary_path =
chromedriver_path =
