# Non-secret settings. Environment variables listed in README take precedence.
# Store credentials in .env or environment variables, not in this file.

[weather]
latitude = 60.12345
longitude = 15.27237
timezone = Europe/Stockholm
forecast_hours = 36

[operation]
test_mode = true
fan_assist_enabled = false
sensibo_max_fan_level =
grid_poll_interval_seconds = 300
fan_poll_interval_seconds = 60
log_file = heating_data_log.csv

[heating]
# SEK/kWh: 0 disables the direct spot-price override.
spotPriceLimit = 0
max_price_threshold = 3.0
pellet_price_adjustment = 0.94875 # SEK/kWh
heat_pump_scop = 3.8
min_heat_pump_capacity = 3.0
pellet_stove_capacity = 5.0
heat_pump_capacity_below_minimum = 2.6
# Descending minimum temperatures in Celsius and capacities in kW.
heat_pump_capacity_by_temperature =
    0, 6.5
    -12.5, 4.0
    -17.5, 3.6

[connections]
solis_base_url = https://api.soliscloud.com:13333
chrome_binary_path =
chromedriver_path =
